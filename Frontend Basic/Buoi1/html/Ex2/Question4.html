<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 4</title>
</head>
<body>
    <h2>Register</h2>
    <p><i>Please fill in this form to create an account</i></p>
    <form>
        <label>
            Full name <span style="color:red">*</span>
        </label><br>
        <input type="text" placeholder="Input your fullname..." required>
        <br><br>

        <label>
            Username <span style="color:red">*</span>
        </label><br>
        <input type="text" placeholder="Input your username..." required>
        <br><br>

         <label>
            Password <span style="color:red">*</span>
        </label><br>
        <input type="text" placeholder="Input your password..." required>
        <br><br>

         <label>
            Email <span style="color:red">*</span>
        </label><br>
        <input type="text" placeholder="Input your email..." required>
        <br><br>

         <label>
            Telephone number <span style="color:red">*</span>
        </label><br>
        <input type="text" placeholder="Input your phone number..." required>
        <br><br>
        
        <label>Input Object:</label><br>
        <input type="radio" name="Object"> Student
        <input type="radio" name="Object"> Teacher
        <br><br>

        <label>Favorite:</label><br>
        <input type="checkbox"> Badminton
        <input type="checkbox" > Volleyball
        <input type="checkbox" > Football
        <br><br>

        <label>
            Address <span style="color:red">*</span>
        </label><br>
        <select >
            <option>Bắc Giang</option>
        </select>
        <br><br>

        <label>
            Birthday <span style="color:red">*</span>
        </label><br>
        <input type="date">
        <br><br>

        <label>
             Your picture <span style="color:red">*</span>
        </label><br>
        <input type="file">
        <br><br>
        <input type="submit" value="Đăng ký">

    </form>
</body>
</html>
